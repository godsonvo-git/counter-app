<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Program-JS</title>
    <link rel="icon" href="icon-1.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-part-1">
            <h1>Counter App</h1>
            <label id="countLabel">0</label>
        </div>
        <div class="card-part-2">
            <button id="decreaseBtn" class="button">Decrease</button>
            <button id="resetBtn" class="button">Reset</button>
            <button id="increaseBtn" class="button">Increase</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
